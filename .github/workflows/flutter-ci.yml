name: Flutter CI

on:
  push:
    branches:
      - main
      - fix/*
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  flutter-ci:
    name: Flutter CI & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Run Node.js administrative script tests
        run: |
          cd scripts/admin
          npm ci
          npm test
          cd ../..

      - name: Configure temporary CI signing keystore
        run: |
          KEYSTORE_PATH="$(pwd)/android/app/ci-release.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" \
            -alias cikey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cisecret -keypass cisecret \
            -dname "CN=MachAlert CI, OU=Engineering, O=MachAlert, C=US"
          cat <<EOF > android/key.properties
          storePassword=cisecret
          keyPassword=cisecret
          keyAlias=cikey
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Verify release APK artifact exists
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
